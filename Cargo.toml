[workspace]
members = [".", "sql_macro"]

[package]
name = "neon-wasi-http"
version = "0.6.1"
edition = "2024"
authors = ["Timmy Silesmo"]
description = "Neon Postgres WASI HTTP driver"
license = "Apache-2.0"
repository = "https://github.com/Nor2-io/neon-wasi-http"
keywords = ["neon", "database", "postgres", "postgresql"]

[features]
orm_beta = ["dep:sql_macro"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

sql_macro = { version = "0.1", optional = true }

[target.'cfg(target_os = "wasi")'.dependencies]
wstd = "0.6"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
wstd = "0.6"

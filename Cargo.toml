[workspace]
members = [".", "sql_macro"]

[package]
name = "neon-wasi-http"
version = "0.3.2"
edition = "2021"
authors = ["Timmy Silesmo"]
description = "Neon Postgres WASI HTTP driver"
license = "Apache-2.0"
repository = "https://github.com/Nor2-io/neon-wasi-http"
keywords = ["neon", "database", "postgres", "postgresql"]

[dependencies]
sql_macro = { path = "sql_macro" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
anyhow = "1.0.99"

[target.'cfg(target_os = "wasi")'.dependencies]
wstd = "0.5.4"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
reqwest = { version = "0.12.23", features = ["json"] }

[dev-dependencies]
wstd = "0.5.4"
